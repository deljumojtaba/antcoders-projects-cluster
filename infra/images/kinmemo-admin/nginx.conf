# Same behaviour as the admin.kinmemo.app block in the Caddyfile. /admin/* API
# calls never reach this container: Traefik routes them to kinmemo-api.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri.html /index.html;
    }
}
