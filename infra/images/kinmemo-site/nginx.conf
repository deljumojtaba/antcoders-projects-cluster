# Same behaviour as the kinmemo.app block in kinmemo/backend/deploy/Caddyfile.
# nginx drops server-level add_header in any location that sets its own, so
# every location includes the security headers explicitly.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location /locales/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # Universal links: iOS requires this exact content type, no redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }
}
