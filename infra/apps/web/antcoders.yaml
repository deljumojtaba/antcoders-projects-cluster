# antcoders.dev — the static Next.js export in antcoders/, served by the nginx
# image its own Dockerfile already builds (listens on 80).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: antcoders-web
  namespace: web
  labels: { app: antcoders-web }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: antcoders-web }
  template:
    metadata:
      labels: { app: antcoders-web }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: antcoders.dev/pool, operator: NotIn, values: [game] }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: antcoders-web }
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: nginx
          image: ghcr.io/deljumojtaba/antcoders-web:latest
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: antcoders-web
  namespace: web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: antcoders-web }
---
apiVersion: v1
kind: Service
metadata:
  name: antcoders-web
  namespace: web
spec:
  selector: { app: antcoders-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: antcoders-web
  namespace: web
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`antcoders.dev`) || Host(`www.antcoders.dev`)
      kind: Rule
      middlewares:
        - { name: security-headers, namespace: traefik }
      services:
        - { name: antcoders-web, port: 80 }
  tls: {}
