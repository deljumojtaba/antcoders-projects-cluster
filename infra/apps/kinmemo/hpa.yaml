# Enable (add to kustomization.yaml) only after Kinmemo uploads move to R2 and
# kinmemo-api uses a RollingUpdate strategy without the shared volume.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kinmemo-api
  namespace: kinmemo
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: kinmemo-api }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kinmemo-api
  namespace: kinmemo
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: kinmemo-api }
