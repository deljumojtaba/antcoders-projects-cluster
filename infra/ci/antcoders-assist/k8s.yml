# Antcoders Assist: Go API (repo root) and Next.js panel (web/admin).
name: k8s

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: assist-api, context: ".", container: api }
          - { name: assist-panel, context: "web/admin", container: panel }
    concurrency: ${{ matrix.name }}
    env:
      IMAGE: ghcr.io/deljumojtaba/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://ai.antcoders.dev
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Deploy
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          echo "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n assist set image deployment/${{ matrix.name }} ${{ matrix.container }}="$IMAGE:$GITHUB_SHA"
          kubectl -n assist rollout status deployment/${{ matrix.name }} --timeout=5m
      # Keeps the last 10 images (room for rollbacks); older ones are deleted from GHCR.
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 10
