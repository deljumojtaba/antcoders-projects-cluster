# antcoders.dev: static export in the repo's own nginx Dockerfile.
name: k8s

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/deljumojtaba/antcoders-web

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency: antcoders-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          echo "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n web set image deployment/antcoders-web nginx="$IMAGE:$GITHUB_SHA"
          kubectl -n web rollout status deployment/antcoders-web --timeout=5m
      # Keeps the last 10 images (room for rollbacks); older ones are deleted from GHCR.
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: antcoders-web
          package-type: container
          min-versions-to-keep: 10
