# Kinmemo API + worker: build, migrate, then roll out. Migrations run as a Job
# BEFORE the new pods start, never on boot, same rule as the old deploy.sh.
name: k8s-backend

on:
  push:
    branches: [master]
    paths: ["backend/**", "deploy/k8s/migrate-job.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/deljumojtaba/kinmemo-backend

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency: kinmemo-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          echo "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n kinmemo delete job kinmemo-migrate --ignore-not-found --wait=true
          sed "s|IMAGE|$IMAGE:$GITHUB_SHA|" deploy/k8s/migrate-job.yaml | kubectl -n kinmemo apply -f -
          if ! kubectl -n kinmemo wait --for=condition=complete job/kinmemo-migrate --timeout=5m; then
            kubectl -n kinmemo logs job/kinmemo-migrate || true
            echo "Migration failed: the running version is untouched." >&2
            exit 1
          fi
          kubectl -n kinmemo logs job/kinmemo-migrate
      - name: Roll out
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n kinmemo set image deployment/kinmemo-api api="$IMAGE:$GITHUB_SHA"
          kubectl -n kinmemo set image deployment/kinmemo-worker worker="$IMAGE:$GITHUB_SHA"
          kubectl -n kinmemo rollout status deployment/kinmemo-api --timeout=5m
          kubectl -n kinmemo rollout status deployment/kinmemo-worker --timeout=5m
      # Keeps the last 10 images (room for rollbacks); older ones are deleted from GHCR.
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: kinmemo-backend
          package-type: container
          min-versions-to-keep: 10
