# Kelime Savaşı game service.
#
# Every push to master that touches backend/ BUILDS an image. Deploying is a
# separate, manual button (Actions -> k8s-backend -> Run workflow), because a
# deploy restarts the single game pod and drops live matches. Run it in a quiet
# hour (04:00-06:00 Istanbul). Leave `tag` empty to deploy the latest build.
name: k8s-backend

on:
  push:
    branches: [master]
    paths: ["backend/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (commit SHA) to deploy; empty = this commit"
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/deljumojtaba/kelime-service

jobs:
  build:
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keeps the last 20 images; older ones are deleted from GHCR. The game keeps
      # more because it can build many times between manual deploys, and the
      # running image must still exist if its pod moves to another node.
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: kelime-service
          package-type: container
          min-versions-to-keep: 20

  deploy:
    if: github.event_name == 'workflow_dispatch' && !failure() && !cancelled()
    needs: [build]
    runs-on: ubuntu-latest
    concurrency: kelime-backend-deploy
    steps:
      - name: Deploy (restarts the game pod)
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
          TAG: ${{ inputs.tag || github.sha }}
        run: |
          echo "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n game set image deployment/kelime-service service="$IMAGE:$TAG"
          # 200 s grace for live matches + startup.
          kubectl -n game rollout status deployment/kelime-service --timeout=8m
