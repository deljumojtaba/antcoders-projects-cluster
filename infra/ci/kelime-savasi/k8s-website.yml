# kelimesavasi.app. Deploys ONLY when website/ (or its Dockerfile) changes; the admin panel
# and the game server are never touched. Rolling update, no downtime.
name: k8s-website

on:
  push:
    branches: [master]
    paths: ["website/**", "deploy/k8s/kelime-website/**", ".github/workflows/k8s-website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/deljumojtaba/kelime-website

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency: kelime-website
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/k8s/kelime-website/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=kelime-website
          cache-to: type=gha,mode=max,scope=kelime-website
      - name: Deploy
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_CI }}
        run: |
          echo "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n game set image deployment/kelime-website nginx="$IMAGE:$GITHUB_SHA"
          kubectl -n game rollout status deployment/kelime-website --timeout=5m
      # Keeps the last 10 images (room for rollbacks); older ones are deleted from GHCR.
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: kelime-website
          package-type: container
          min-versions-to-keep: 10
