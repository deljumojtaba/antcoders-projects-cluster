# CloudNativePG operator. The operator itself is light; the Postgres pods it
# manages are defined in databases/.
#
# Two replicas (leader election): failover is performed BY the operator, so a
# single copy on the node that died would delay failover ~5 minutes until
# Kubernetes rescheduled it. Found in the node power-off test.
replicaCount: 2

resources:
  requests: { cpu: 20m, memory: 96Mi }
  limits: { memory: 256Mi }

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: antcoders.dev/pool, operator: NotIn, values: [game] }

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: cloudnative-pg
    # Only count pods of the same rollout, or old pods skew placement during an upgrade.
    matchLabelKeys: [pod-template-hash]
