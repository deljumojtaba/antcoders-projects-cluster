# Metrics + Grafana, sized for 3 small nodes (~600 MB total).
#
# Alerts are Grafana-managed (Alerting -> Contact points -> Telegram), so
# vmalert/alertmanager are off to save memory. Uptime checks from outside the
# cluster are Uptime Kuma's job (monitoring/uptime-kuma.yaml).
#
# Grafana is not exposed publicly:
#   kubectl -n monitoring port-forward svc/vm-grafana 3000:80

x-not-game: &notGame
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: antcoders.dev/pool, operator: NotIn, values: [game] }

victoria-metrics-operator:
  affinity: *notGame
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 192Mi }

vmsingle:
  spec:
    retentionPeriod: "14d"
    # 512Mi was OOM-killed at startup. Caches take a share of the limit, so
    # cap that share and fewer concurrent queries keep the peak predictable.
    extraArgs:
      memory.allowedPercent: "40"
      search.maxConcurrentRequests: "4"
    affinity: *notGame
    priorityClassName: low
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { memory: 1Gi }
    storage:
      storageClassName: local-path    # losing 14 days of metrics on a node failure is acceptable
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 10Gi

vmagent:
  spec:
    affinity: *notGame
    priorityClassName: low
    resources:
      requests: { cpu: 20m, memory: 96Mi }
      limits: { memory: 256Mi }

alertmanager:
  enabled: false
vmalert:
  enabled: false
defaultRules:
  create: false

grafana:
  enabled: true
  affinity: *notGame
  priorityClassName: low
  admin:
    existingSecret: grafana-admin     # secrets/monitoring/grafana-admin.yaml
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  affinity: *notGame
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

# k3s runs these inside the k3s binary; there is nothing separate to scrape.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
