# TLS and middlewares shared by every app.
#
# Certificates are Cloudflare Origin certificates (SSL/TLS -> Origin Server ->
# Create certificate, 15 years), one per Cloudflare zone, stored as secrets in
# the traefik namespace (see secrets/traefik/). Traefik picks the right one
# by SNI, so routes only need `tls: {}`.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  certificates:
    - secretName: tls-kelimesavasi
    - secretName: tls-kinmemo
    - secretName: tls-antcoders
  defaultCertificate:
    secretName: tls-antcoders
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS12
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Server: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: traefik
spec:
  compress: {}
