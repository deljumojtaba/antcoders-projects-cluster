# TLS and middlewares shared by every app.
#
# Certificates are Cloudflare Origin certificates (SSL/TLS -> Origin Server ->
# Create certificate, 15 years), one per Cloudflare zone, stored as secrets in
# the traefik namespace (see secrets/traefik/). Traefik picks the right one
# by SNI, so routes only need `tls: {}`.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  certificates:
    - secretName: tls-kelimesavasi
    - secretName: tls-kinmemo
    - secretName: tls-antcoders
  defaultCertificate:
    secretName: tls-antcoders
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS12
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Server: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: traefik
spec:
  compress: {}
---
# Only Cloudflare's edge may reach routes that use this. Behind the LB's proxy
# protocol, the connection's source IP is the real client — Cloudflare for
# anyone who went through DNS, the attacker's own IP for anyone who connects to
# the LB directly. Used for admin-only tools protected by Cloudflare Access, so
# the Access login cannot be skipped by hitting 49.13.42.163 directly.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
