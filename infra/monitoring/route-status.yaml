# Uptime Kuma on status.antcoders.dev, behind Cloudflare Access (application
# "Monitoring", policy "Only me") plus the cloudflare-only middleware.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: status
  namespace: monitoring
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`status.antcoders.dev`)
      kind: Rule
      middlewares:
        - { name: cloudflare-only, namespace: traefik }
        - { name: security-headers, namespace: traefik }
      services:
        - { name: uptime-kuma, port: 3001 }
  tls: {}
