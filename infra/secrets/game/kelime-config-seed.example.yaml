# The game's config.yaml, used ONLY on the first start to seed the volume.
#
# Start from the SERVER copy, not your local one: the admin panel has written
# live edits to it.
#   scp -i ~/.ssh/antcoders_deploy root@178.105.72.95:/opt/kelime-savasi/backend/config.prod.yaml .
# (check REMOTE_DIR in kelime-savasi/deploy.sh for the exact path)
#
# Then change only these fields and paste the whole file below:
#   postgres.host      pg-game-rw
#   postgres.password  same as pg-game-kelime
#   redis.addr         redis:6379
#   google_service_account_path   /app/google-service-account.json
apiVersion: v1
kind: Secret
metadata:
  name: kelime-config-seed
  namespace: game
stringData:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
    # ... the rest of config.prod.yaml ...
