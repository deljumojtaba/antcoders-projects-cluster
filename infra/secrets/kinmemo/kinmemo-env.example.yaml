# Everything that was in /opt/kinmemo/.env on the old server, with the
# database and Redis hosts changed to the cluster services.
#   ssh root@5.75.135.98 cat /opt/kinmemo/.env
# The superuser password: kubectl -n data get secret pg-apps-superuser -o jsonpath='{.data.password}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: kinmemo-env
  namespace: kinmemo
stringData:
  ENV: production
  DATABASE_URL: postgres://kinmemo_app:PASSWORD@pg-apps-rw.data.svc:5432/kinmemo?sslmode=require
  SYSTEM_DATABASE_URL: postgres://kinmemo_system:PASSWORD@pg-apps-rw.data.svc:5432/kinmemo?sslmode=require
  MIGRATE_DATABASE_URL: postgres://postgres:PASSWORD@pg-apps-rw.data.svc:5432/kinmemo?sslmode=require
  REDIS_URL: redis://redis.kinmemo.svc:6379/0
  PUBLIC_BASE_URL: https://api.kinmemo.app
  JWT_SECRET: "..."
  OPENAI_API_KEY: "..."
  RESEND_API_KEY: "..."
  ADMIN_USER: "..."
  ADMIN_PASSWORD: "..."
  EXPO_ACCESS_TOKEN: "..."
  # ... every other key from the old .env ...
