# Cloudflare dashboard -> antcoders zone -> SSL/TLS -> Origin Server -> Create
# certificate (RSA, hostnames: the apex and *.apex, 15 years). Paste both PEMs.
apiVersion: v1
kind: Secret
metadata:
  name: tls-antcoders
  namespace: traefik
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    ...
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    ...
    -----END PRIVATE KEY-----
